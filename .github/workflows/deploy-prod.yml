name: Deploy prod

# Deploy the checkin app to the AWS prod environment when a release is
# published in this repo. Mirrors deploy-dev.yml step-for-step (build an ARM64
# image, run DB migrations, roll out the ECS service) with these differences:
#   - trigger: a published GitHub release instead of a merge to main
#   - guard 1: the released commit must live on the rel/* branch matching its
#              own version — see the `release-branch-match` job. Prod ships
#              only from release branches; a release cut from main (or any
#              other ref) fails fast here, before any CI or human approval is
#              spent on it.
#   - guard 2: RE-RUNS the entire CI pipeline (tests + the deploy build/smoke)
#              against the released tag — see the `validate` job. A release can
#              be cut from any commit ON a rel/* branch, and stale or partial
#              check status on that commit is not trustworthy, so we revalidate
#              from scratch rather than querying past check-runs.
#   - gate:    `deploy` (needs both guards) targets the `production` GitHub
#              Environment, which holds the human-approval rule (required
#              reviewers — one approval). The guards run first (no
#              environment), so the reviewer approves a release that has
#              already proven its branch origin and gone green on its own tag.
#   - report:  a run step summary (releases have no comment thread to post to)
#
# Auth is GitHub OIDC (no static AWS keys) — assumes the checkin-deploy-prod
# role defined in ~/projects/treehouse/aws/infra/modules/checkin/iam.tf.
#
# Cutting a release:
#   git push origin main:refs/heads/rel/1.2       # or fast-forward an existing rel/*
#   gh release create v1.2.3 --target rel/1.2 --generate-notes
# Publishing (not drafting) is what fires this. Re-publishing a draft works;
# pre-releases deploy too — don't mark a release pre if it shouldn't ship.

on:
  release:
    types: [published]

permissions:
  id-token: write   # assume the deploy role via OIDC (deploy job only)
  contents: read    # checkout the released tag (validate + deploy)
  packages: write   # push the image to ghcr.io (deploy job)
  # checks: write is not used by THIS workflow — it's the ceiling for the
  # reusable ci.yml call: its `test` job requests checks: write (dorny
  # test-reporter), and a called job may never exceed the caller's grants.
  # Without this line the run dies at startup_failure with zero jobs —
  # which is exactly how v1.0.0's first deploy attempt failed (2026-07-14).
  checks: write

concurrency:
  group: checkin-deploy-prod
  cancel-in-progress: false  # serialize deploys; never abandon one mid-rollout

env:
  AWS_REGION: us-east-2
  # The fleet standardized on ghcr.io (dev, arbor, s-read, bootstrap all push
  # there; the prod task defs pull via the shared ghcr-pull-credentials
  # secret). The ECR registry this workflow originally targeted is vestigial.
  IMAGE_REPO: ghcr.io/innovationtreehouse/checkin-prod
  # Prod runs on the shared Managed-Instances cluster, not a dedicated
  # checkin-prod cluster (infra #104 destroyed that one). Names below come from
  # the infra repo — see the "prod infra" note in the PR description.
  ECS_CLUSTER: treehouse-prod
  ECS_SERVICE: checkin-prod
  # Migrations run on FARGATE_SPOT, not the prepaid c6g (a one-off 512-MiB task
  # can't place there while the wiki is awake — the v1.0.1 wedge). awsvpc needs
  # explicit networking: the default-VPC public subnets + the checkin-prod
  # service SG (Aurora ingress: infra network module, database_from_checkin_prod;
  # public IP for the ghcr pull — no NAT). Values come from the infra repo
  # (live/mgmt + modules/network); update together if infra changes them.
  MIGRATE_SUBNETS: subnet-0597513f1c0c3173e,subnet-0a67d72908bffbcd4,subnet-0c84ac2840be3a2bc
  MIGRATE_SG: sg-0a37ac72f79b2fd5b # checkin-prod-service
  APP_TASK_FAMILY: checkin-prod
  MIGRATE_TASK_FAMILY: checkin-migrate-prod
  DEPLOY_ROLE: arn:aws:iam::639595353568:role/checkin-deploy-prod
  APP_URL: https://ops.innovationtreehouse.org

jobs:
  # A release must ship from its OWN release line: v1.1.x may only be cut from
  # rel/1.1. Supersedes the old branch-guard job (any rel/* branch) — matching
  # the specific line implies containment in some rel/* line, so running both
  # was redundant.
  #
  # Checks ANCESTRY, not `release.target_commitish`. That field can be a branch
  # name OR a bare SHA, is chosen by whoever cut the release, and is re-taggable —
  # containment in the branch is the property we actually care about.
  #
  # Runs before `validate` so a mis-cut release fails in seconds with one clear
  # error, instead of burning a full CI pass in parallel first.
  release-branch-match:
    name: Release version matches its rel/ branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0   # ancestry check needs real history, not a shallow clone

      - name: Assert the tag's line matches the branch containing it
        run: ./scripts/release-branch-match.sh "${{ github.event.release.tag_name }}"

  # Re-run the FULL CI pipeline (lint, type-check, migration-drift, Jest, the
  # security contract tests, AND the deploy build + boot/smoke) against the exact
  # released tag. This is the H1 fix: a release tag can point at any commit, and
  # we no longer trust whatever check status happened to exist there — we prove
  # the released code green from scratch before a human is even asked to approve.
  # Needs release-branch-match so a mis-cut release fails with ONE error
  # instead of burning a full CI pass in parallel with the rejection.
  validate:
    name: Revalidate CI on the released tag
    needs: [release-branch-match]   # never burn a CI pass on a mis-cut release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    secrets: inherit

  # Migration COUNT is deliberately ungated here — no CI job blocks a release
  # on how many new migrations it carries. The team manages coalescing
  # manually per release (docs/MIGRATION_COALESCE_FLOW.md is still the
  # playbook and its script still works); this used to be enforced by a
  # blocking release-time job (removed) plus an advisory PR-time check (also
  # removed) — both judged a per-release human call, not CI's, after the old
  # gate blocked the legitimate v1.0.4 deploy (4 additive migrations vs. its
  # budget of 1).
  #
  # Historical warning, still true: `prisma migrate deploy` is not
  # transactional across migrations, so a multi-migration release that fails
  # mid-batch can leave prod partially migrated behind a P3009 (the
  # 2026-07-02 incident). A human should still weigh coalescing before
  # releasing a multi-migration batch.

  deploy:
    name: Build, migrate, roll out
    # Both listed explicitly, not just [validate]: the branch gate is a release
    # correctness property, and a refactor that changes what `validate` needs
    # must not be able to drop it silently.
    needs: [release-branch-match, validate]
    runs-on: ubuntu-24.04-arm  # native ARM64 — task defs require arm64 images
    environment:
      name: production
      url: https://ops.innovationtreehouse.org
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          # Full history + tags for `git describe` below (see deploy-dev.yml's
          # note: a shallow clone degrades describe to a bare SHA silently).
          fetch-depth: 0

      - name: Resolve released commit
        id: vars
        run: |
          # release.target_commitish can be a branch name, so resolve the SHA
          # from the checked-out tag itself.
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          # On a release this normally reads "<tag>-0-g<sha>" — the -0- is the
          # point: it proves the deployed commit IS the tag, not a descendant.
          DESCRIBE=$(git describe --tags --long --abbrev=7 --always)
          echo "describe=$DESCRIBE" >> "$GITHUB_OUTPUT"
          echo "build describe: $DESCRIBE"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        env:
          IMAGE: ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.sha }}
          IMAGE_TAGGED: ${{ env.IMAGE_REPO }}:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          # Native arm64 runner -> a plain build produces the arm64 image the
          # ECS task defs require (runtime_platform.cpu_architecture = ARM64).
          # -f: there is no root Dockerfile — the app image builds from
          # checkin-app/Dockerfile with the repo root as context, exactly like
          # deploy-dev.yml (the release-scrub found this job would die here).
          # Deliberately NOT passing --build-arg NEXT_PUBLIC_GIT_BRANCH here:
          # this job checks out github.event.release.tag_name, so github.ref_name
          # IS the tag, not a branch — passing it through would just duplicate
          # NEXT_PUBLIC_RELEASE_TAG in the footer ("v1.1.0 v1.1.0 abc1234").
          # release.target_commitish is sometimes a branch name, but it's the
          # branch the tag was CUT from, not necessarily anything meaningful by
          # release time, and resolving "the real branch a commit belongs to" is
          # itself ambiguous (a commit can be on several, or on none once a
          # branch is deleted post-release). Left unset -> the footer omits the
          # branch part and shows "<tag> <sha7>", which is what prod wants anyway.
          docker build \
            --build-arg NEXT_PUBLIC_GIT_SHA="${{ steps.vars.outputs.sha }}" \
            --build-arg NEXT_PUBLIC_GIT_DESCRIBE="${{ steps.vars.outputs.describe }}" \
            --build-arg NEXT_PUBLIC_RELEASE_TAG="${{ steps.vars.outputs.tag }}" \
            -f checkin-app/Dockerfile \
            -t "$IMAGE" -t "$IMAGE_TAGGED" .
          docker push "$IMAGE"
          docker push "$IMAGE_TAGGED"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          # Register a new revision of the migrate task def pointing at the new
          # image (run-task can't override the image, only command/env), keeping
          # only the fields register-task-definition accepts. Goes through a real
          # temp file: the runner's aws CLI cannot read file:///dev/stdin.
          aws ecs describe-task-definition \
            --task-definition "$MIGRATE_TASK_FAMILY" \
            --query taskDefinition --output json \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | {family, taskRoleArn, executionRoleArn, networkMode,
                   containerDefinitions, requiresCompatibilities, cpu, memory,
                   runtimePlatform}' > "$RUNNER_TEMP/migrate-taskdef.json"
          MIGRATE_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/migrate-taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered migrate task def: $MIGRATE_ARN"

          # The shared Aurora cluster is Serverless v2 with min capacity 0 and
          # auto-pause: if it's idle at deploy time, the first connection races
          # the ~30s resume and Prisma fails fast with P1001. Override the
          # container command with a retry loop so the task survives the wake-up.
          cat > "$RUNNER_TEMP/migrate-overrides.json" <<'EOF'
          {
            "containerOverrides": [{
              "name": "checkin-migrate",
              "command": ["sh", "-c",
                "cd checkin-app && for i in 1 2 3 4 5; do ../scripts/each-library.sh exec -- prisma migrate deploy && npx prisma migrate deploy && exit 0; echo \"attempt $i failed — DB may be resuming from auto-pause; retrying in 20s\"; sleep 20; done; exit 1"]
            }]
          }
          EOF

          # treehouse-prod is ECS Managed Instances: the app + migrate task defs
          # are host-networked/EC2-compatible here (modules/checkin/compute.tf),
          # and the service itself has no networkConfiguration (its dynamic
          # block is empty on Managed Instances) — unlike dev's Fargate/awsvpc
          # path, there is no network config to copy and no FARGATE launch type
          # to use. Launch via the cluster's capacity provider instead, with no
          # --network-configuration at all.
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$MIGRATE_ARN" \
            --capacity-provider-strategy capacityProvider=FARGATE_SPOT,weight=1 \
            --network-configuration "awsvpcConfiguration={subnets=[$MIGRATE_SUBNETS],securityGroups=[$MIGRATE_SG],assignPublicIp=ENABLED}" \
            --overrides "file://$RUNNER_TEMP/migrate-overrides.json" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"

          # Surface the container's own output either way — without this, a failure
          # only shows the exit code here and the real Prisma error (P3009 etc.)
          # hides in CloudWatch, which is how the 2026-07-02 P3009 wedge went
          # undiagnosed for a day (mirrors deploy-dev.yml).
          TASK_ID="${TASK_ARN##*/}"
          echo "--- migrate container logs (/ecs/checkin-migrate-prod) ---"
          ./scripts/dump-task-logs.sh /ecs/checkin-migrate-prod "ecs/checkin-migrate/$TASK_ID"
          echo "--- end migrate container logs ---"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Database migration failed (exit $EXIT_CODE) — see migrate container logs above"
            exit 1
          fi

      - name: Deploy to ECS
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail
          # Register a new app task-def revision with the new image. The service
          # has lifecycle.ignore_changes on task_definition, so CI owns rollout.
          # Same temp-file dance as the migrate step (no /dev/stdin on the runner).
          aws ecs describe-task-definition \
            --task-definition "$APP_TASK_FAMILY" \
            --query taskDefinition --output json \
            | jq --arg IMG "$IMAGE" '
                .containerDefinitions[0].image = $IMG
                | {family, taskRoleArn, executionRoleArn, networkMode,
                   containerDefinitions, volumes, placementConstraints,
                   requiresCompatibilities, cpu, memory, runtimePlatform}' > "$RUNNER_TEMP/app-taskdef.json"
          APP_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/app-taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered app task def: $APP_ARN"

          # --desired-count 1: the service is STAGED at 0 until the first
          # release (infra sets desired_count = 0 with ignore_changes on it —
          # "the deploy pipeline scales this up when it ships a real image").
          # Without this, update-service keeps 0, a 0/0 service is instantly
          # "stable", and the run goes green while serving nothing.
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$APP_ARN" \
            --desired-count 1 >/dev/null

          echo "Waiting for the service to reach steady state..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Service is stable."

      - name: Smoke test the live app
        run: |
          set -euo pipefail
          # A real probe of the DEPLOYED service (CI's boot/smoke checks the
          # image, not production). The app answers 200 or an auth redirect;
          # retries cover target registration + first boot after scale-up.
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$APP_URL" || echo 000)
            echo "attempt $i: $APP_URL -> HTTP $CODE"
            case "$CODE" in
              200|301|302|307|308) echo "Smoke OK."; exit 0 ;;
            esac
            sleep 10
          done
          echo "::error::Smoke test failed: $APP_URL never answered with 200/redirect"
          exit 1

      # s-read rides every prod release, in THIS job — after the app is live, on
      # the same released tag (still checked out) and the same already-assumed
      # checkin-deploy-prod credentials. Folded in (rather than a separate job
      # carrying its own `environment: production`) so the release takes ONE
      # approval instead of two: only this job enters the production environment.
      # The composite writes its own step-summary section.
      - name: Deploy s-read (prod)
        uses: ./.github/actions/deploy-s-read
        with:
          environment: prod
          network-config: ${{ vars.S_READ_NETWORK_CONFIG }}

      - name: Report result
        if: always()
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          if [ "$STATUS" = "success" ]; then
            {
              echo "### ✅ Released $TAG to prod (app + s-read)"
              echo "Commit \`$SHORT_SHA\` is live on [$APP_URL]($APP_URL)."
              echo "- Image: \`$IMAGE_REPO:$TAG\`"
              echo "- Migrations: applied · Service: stable · s-read: deployed"
              echo "- [Release]($RELEASE_URL) · [Deploy run]($RUN_URL)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Prod deploy of $TAG failed (status: \`$STATUS\`)"
              echo "- [Deploy run]($RUN_URL) — check the logs (app and/or s-read)."
              echo "- The app rolls out before s-read: if the app step passed, prod runs the new image and only s-read needs a rerun; otherwise prod still runs the previous image."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
