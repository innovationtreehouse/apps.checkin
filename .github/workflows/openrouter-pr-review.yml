name: openrouter pr review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

# Unrelated label events get their own group so they cannot cancel a running review.
concurrency:
  group: openrouter-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # Spends the OpenRouter key, so a maintainer must opt the PR in with the ai-review
    # label (applying labels needs triage access). Fork PRs get no secrets anyway.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # One review plus at most one rerun, each under the action's 22-minute budget.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Routing, prompt and checklists come from the default branch, so neither the PR nor a
      # stacked parent branch can edit the reviewer.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .ai-review-base
          sparse-checkout: |
            .github/scripts
            .github/ai-review
          persist-credentials: false
      - id: cfg
        run: |
          if [ -f .ai-review-base/.github/scripts/ai-review-route.py ]; then
            echo "AI review config from $(git -C .ai-review-base rev-parse --short HEAD)"
            echo "dir=.ai-review-base" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No AI review config on the default branch yet; no review ran."
          fi
      # Jev Router picks the review profiles and the tier; see .github/scripts/ai-review-route.py.
      # Routing and judging never fail the check; a failure skips or ends the review instead.
      - id: route
        if: steps.cfg.outputs.dir != ''
        continue-on-error: true
        run: python3 ${{ steps.cfg.outputs.dir }}/.github/scripts/ai-review-route.py
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_CFG: ${{ steps.cfg.outputs.dir }}/.github/ai-review
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - id: review
        if: steps.route.outputs.model != ''
        continue-on-error: true
        uses: innovationtreehouse/openrouter-pr-review-action@29a5faa6f3f6c4f8cf2f5d36a97060f0330fd21e # fork: upstream 26f990a + Gemini 4 signature and no-schema fixes (fork #1, #2)
        with:
          pr_number: ${{ github.event.pull_request.number }}
          models: ${{ steps.route.outputs.model }}
          max_tool_turns: ${{ steps.route.outputs.max_tool_turns }}
          max_diff_kb: ${{ steps.route.outputs.max_diff_kb }}
          effort: ${{ steps.route.outputs.effort }}
          custom_instructions: ${{ steps.route.outputs.instructions }}
          path_profiles: ${{ steps.route.outputs.path_profiles }}
          fail_on: never
          # Re-reviews only: cached brief of a long PR body and overflowing history.
          compaction: auto
          compaction_model: nvidia/nemotron-3.5-super-vl:free
          # Continue the review loop only on new commits; label and reopen start fresh.
          review_mode: ${{ github.event.action == 'synchronize' && 'auto' || 'initial' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Jev judges whether the posted review is complete; if not, it picks a higher tier to rerun once.
      - id: judge
        if: always() && steps.route.outputs.model != ''
        continue-on-error: true
        run: python3 ${{ steps.cfg.outputs.dir }}/.github/scripts/ai-review-route.py adjudicate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_CFG: ${{ steps.cfg.outputs.dir }}/.github/ai-review
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TIER: ${{ steps.route.outputs.tier }}
          PROFILES: ${{ steps.route.outputs.profiles }}
          VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_URL: ${{ steps.review.outputs.review_url }}
      - id: rerun
        if: always() && steps.judge.outputs.rerun_tier != '' && steps.judge.outputs.rerun_tier != 'none'
        continue-on-error: true
        uses: innovationtreehouse/openrouter-pr-review-action@29a5faa6f3f6c4f8cf2f5d36a97060f0330fd21e # fork: upstream 26f990a + Gemini 4 signature and no-schema fixes (fork #1, #2)
        with:
          pr_number: ${{ github.event.pull_request.number }}
          models: ${{ steps.judge.outputs.model }}
          max_tool_turns: ${{ steps.judge.outputs.max_tool_turns }}
          max_diff_kb: ${{ steps.judge.outputs.max_diff_kb }}
          effort: ${{ steps.judge.outputs.effort }}
          custom_instructions: ${{ steps.route.outputs.instructions }}
          path_profiles: ${{ steps.route.outputs.path_profiles }}
          fail_on: never
          # The escalated rerun is a fresh review, not a verify round of the one the judge rejected.
          review_mode: initial
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Advisory only: a recommendation line on the final review plus the ai-recommends-approve label.
      - if: always() && steps.route.outputs.model != ''
        continue-on-error: true
        run: python3 ${{ steps.cfg.outputs.dir }}/.github/scripts/ai-review-route.py recommend
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_CFG: ${{ steps.cfg.outputs.dir }}/.github/ai-review
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RERUN_TIER: ${{ steps.judge.outputs.rerun_tier }}
          REVIEW_VERDICT: ${{ steps.review.outputs.verdict }}
          REVIEW_ISSUES: ${{ steps.review.outputs.issue_count }}
          REVIEW_BUGS: ${{ steps.review.outputs.bug_count }}
          REVIEW_URL: ${{ steps.review.outputs.review_url }}
          RERUN_VERDICT: ${{ steps.rerun.outputs.verdict }}
          RERUN_ISSUES: ${{ steps.rerun.outputs.issue_count }}
          RERUN_BUGS: ${{ steps.rerun.outputs.bug_count }}
          RERUN_URL: ${{ steps.rerun.outputs.review_url }}
      # Posted reviews show a cost word instead of the dollar amount; exact figures stay in this log.
      - if: always() && steps.route.outputs.model != ''
        continue-on-error: true
        run: python3 ${{ steps.cfg.outputs.dir }}/.github/scripts/ai-review-route.py scrub
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AI_REVIEW_CFG: ${{ steps.cfg.outputs.dir }}/.github/ai-review
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
