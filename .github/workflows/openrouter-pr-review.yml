name: openrouter pr review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: openrouter-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Trusted same-repo PRs only: fork PRs get no secrets, and Dependabot has its own secret store.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: FlyOverCoderKY/openrouter-pr-review-action@f0803a825cbd65f8c27ed4d551bdfdca3c03a193 # v1.3.0
        with:
          pr_number: ${{ github.event.pull_request.number }}
          models: anthropic/claude-sonnet-4.6
          fail_on: never
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
