name: openrouter pr review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

# Unrelated label events get their own group so they cannot cancel a running review.
concurrency:
  group: openrouter-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ai-review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  review:
    # Spends the OpenRouter key, so a maintainer must opt the PR in with the ai-review
    # label (applying labels needs triage access). Fork PRs get no secrets anyway.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ai-review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ai-review') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Jev Router picks the review profiles and the tier; see .github/scripts/ai-review-route.py.
      - id: route
        run: python3 .github/scripts/ai-review-route.py
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - id: review
        continue-on-error: true
        uses: FlyOverCoderKY/openrouter-pr-review-action@f0803a825cbd65f8c27ed4d551bdfdca3c03a193 # v1.3.0
        with:
          pr_number: ${{ github.event.pull_request.number }}
          models: ${{ steps.route.outputs.model }}
          max_tool_turns: ${{ steps.route.outputs.max_tool_turns }}
          max_diff_kb: ${{ steps.route.outputs.max_diff_kb }}
          custom_instructions: ${{ steps.route.outputs.instructions }}
          path_profiles: ${{ steps.route.outputs.path_profiles }}
          fail_on: never
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # A failed or partial free-tier review reruns once on GLM-5.3.
      - if: >-
          steps.route.outputs.tier == 'free' &&
          (steps.review.outcome == 'failure' || contains(fromJSON('["partial","error"]'), steps.review.outputs.verdict))
        uses: FlyOverCoderKY/openrouter-pr-review-action@f0803a825cbd65f8c27ed4d551bdfdca3c03a193 # v1.3.0
        with:
          pr_number: ${{ github.event.pull_request.number }}
          models: z-ai/glm-5.3
          max_tool_turns: 30
          custom_instructions: ${{ steps.route.outputs.instructions }}
          path_profiles: ${{ steps.route.outputs.path_profiles }}
          fail_on: never
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
